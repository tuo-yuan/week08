name: 03 - Test Staging

on:
  workflow_run:
    workflows:
      - "02 - Deploy to Staging"
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  smoke-test:
    name: Staging Smoke Test
    runs-on: ubuntu-latest
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    environment:
      name: staging
    env:
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - name: Download staged release
        uses: actions/download-artifact@v8
        with:
          name: staged-release
          path: release
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate staged image SHA
        id: release
        run: |
          set -euo pipefail
          release_file="$GITHUB_WORKSPACE/release/image-tag.txt"
          if [[ ! -f "$release_file" ]]; then
            echo "The staged release artifact did not contain image-tag.txt." >&2
            exit 1
          fi
          mapfile -t release_lines < "$release_file"
          if (( ${#release_lines[@]} != 1 )); then
            echo "The staged release artifact must contain exactly one line." >&2
            exit 1
          fi
          image_sha="${release_lines[0]}"
          if [[ ! "$image_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The staged release artifact did not contain a valid image SHA." >&2
            exit 1
          fi
          echo "image_sha=$image_sha" >> "$GITHUB_OUTPUT"
          echo "IMAGE_SHA=$image_sha" >> "$GITHUB_ENV"

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_102D }}
          tenant-id: ${{ vars.AZURE_TENANT_ID_102D }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_102D }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Verify staging deployment images
        env:
          EXPECTED_IMAGE_SHA: ${{ steps.release.outputs.image_sha }}
        run: |
          set -euo pipefail
          deployments=(
            frontend
            user-service
            student-service
            lecturer-service
            course-service
            enrollment-service
          )
          for deployment in "${deployments[@]}"; do
            expected_image="${ACR_LOGIN_SERVER}/koalatech-${deployment}:${EXPECTED_IMAGE_SHA}"
            actual_image="$(kubectl get deployment "$deployment" \
              -n staging \
              -o jsonpath='{.spec.template.spec.containers[0].image}')"
            if [[ "$actual_image" != "$expected_image" ]]; then
              echo "${deployment} is using ${actual_image}, expected ${expected_image}." >&2
              exit 1
            fi
          done

      - name: Wait for staging frontend IP
        run: |
          for i in {1..60}; do
            FRONTEND_IP=$(kubectl get service frontend \
              -n staging \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$FRONTEND_IP" ]; then
              echo "FRONTEND_IP=$FRONTEND_IP" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Waiting for staging frontend IP..."
            sleep 10
          done
          echo "Unable to find staging frontend IP."
          exit 1

      - name: Test frontend
        run: |
          curl \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            "http://${FRONTEND_IP}"

      - name: Upload tested release
        uses: actions/upload-artifact@v7
        with:
          name: tested-release
          path: release/image-tag.txt
          if-no-files-found: error
